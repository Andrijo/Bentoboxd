<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Bentoboxd — Tu Letterboxd en un dashboard</title>
    <meta
      name="description"
      content="Convierte tu diario de Letterboxd en un dashboard: géneros, directores, actores, países, streaming y juegos con tus películas recientes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bentoboxd" />
    <meta property="og:title" content="Bentoboxd — Tu Letterboxd en un dashboard" />
    <meta
      property="og:description"
      content="Géneros, directores, actores, países, streaming y juegos a partir de tus películas recientes en Letterboxd." />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary" />
    <script>
      try {
        var saved = localStorage.getItem("bentoboxd_theme:v1")
        var light = saved
          ? saved === "light"
          : window.matchMedia("(prefers-color-scheme: light)").matches
        if (light) {
          document.documentElement.dataset.theme = "light"
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f6f4ee")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
